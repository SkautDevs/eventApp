services:
    app:
        build:
            context: .
            args:
                APP_RELEASE: "${APP_RELEASE:-dev}"
        env_file: .env
        volumes:
            - var:/app/var
    web:
        image: nginx:1.27-alpine
        depends_on: [app]
        ports:
            - 8080:80
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./www:/app/www:ro
volumes:
    var:
