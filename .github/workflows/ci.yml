name: CI

on:
  # Master pushes run CI through the deployment pipeline.
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version-file: .github/php-version
          extensions: pdo_sqlite, curl, mbstring, openssl, gmp, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist --no-interaction
      # ubuntu-latest ships Chrome and a matching chromedriver; the browser suite runs in
      # local mode against it, and PANTHER_NO_SKIP turns a missing driver into a failure,
      # so the deploy gate (deploy.yml calls this workflow) never passes on skipped tests
      - name: Locate chromedriver
        run: echo "PANTHER_CHROME_DRIVER_BINARY=$(command -v chromedriver || echo "$CHROMEWEBDRIVER/chromedriver")" >> "$GITHUB_ENV"
      - run: composer test
        env:
          PANTHER_NO_SKIP: '1'

  # Its own job so an advisory shows up as a distinct failed check rather than
  # being lost at the tail of a test run. No `|| true` and no continue-on-error:
  # composer audit exits non-zero on a known-vulnerable package and that must fail
  # the build. Runs against composer.lock, so no vendor install is needed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version-file: .github/php-version
          coverage: none
          tools: composer:v2
      - run: composer audit --locked --no-interaction
