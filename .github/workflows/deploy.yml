name: Deploy via FTP

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version-file: .github/php-version
          extensions: pdo_sqlite, curl, mbstring, openssl, gmp
          coverage: none
          tools: composer:v2

      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y just lftp

      - name: Prepare release
        run: just release

      - name: Sync release
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: just deploy
