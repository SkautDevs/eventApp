[www]
; php-fpm wipes the environment of its workers by default, which hides everything
; docker-compose's env_file put into the container.
clear_env = no

; The image default is 5 children: five readers waiting on a 10 s kissj timeout would
; stall everybody. Twenty at roughly 30 MB each fits the smallest VPS the app runs on.
; nginx waits 45 s (fastcgi_read_timeout). PHP's own max_execution_time (30 s, PHP's built-in
; default) counts CPU time only, not time spent waiting on kissj or a push service, so the
; outbound calls carry their own timeouts (kissj: 10 s) to finish well inside nginx's limit.
; Worker stdout (the app's log lines) reaches `docker logs` through the base image's
; docker.conf (catch_workers_output = yes).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
