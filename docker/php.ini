; The app reads instance-wide settings from $_ENV, which is empty unless "E" is listed.
variables_order = "EGPCS"

; Sessions live in the persistent var volume, not in the container's /tmp, so a restart
; or a redeploy does not log anybody out. The lifetime is deliberately longer than any
; camp and than the 7-day cookie Session sets; with PHP's default (1440 s) a participant
; who comes back after lunch would have lost the TIE login.
session.save_path = "/app/var/sessions"
session.gc_maxlifetime = 2592000
