# nginx reports the proxy's scheme as "on" for PHP's $_SERVER['HTTPS'], or nothing for http.
map $http_x_forwarded_proto $app_https {
    https on;
    default "";
}

# nginx's mime.types has no entry for the web app manifests; without it they go out as
# application/octet-stream and gzip_types below never matches them.
types {
    application/manifest+json webmanifest;
}

# The shared admin link carries ?token=<ADMIN_TOKEN_<SLUG>>. nginx's default "combined" log
# writes the whole request line, token included, so the access log gets a line of its own
# that drops the query string of every request whose path says "admin" in any case or
# carries any %-escape: the app decodes the path before routing, so /<slug>/%61dmin/notify
# and /<slug>/admin%2Fnotify log in too, and a mistyped link still carries a real token.
map $request_uri $loggable_uri {
    "~*^(?<path>[^?]*(?:admin|%[0-9a-f]{2})[^?]*)\?" $path;
    default $request_uri;
}

log_format eventapp '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /app/www;
    index index.php;
    access_log /var/log/nginx/access.log eventapp;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Never serve dotfiles (.htaccess is in the bind-mounted www/); .well-known stays reachable.
    location ~ /\.(?!well-known/) { return 404; }

    # /<slug>/precache.json and /<slug>/offline are app routes: not files, so try_files
    # falls through to the front controller (.json is not in the static location below).
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Mirrors www/.htaccess. The stylesheet and scripts carry a content hash (?v=, asset_version() in templates/_layout.twig), hence
    # the year-long immutable lifetime. The self-hosted fonts and icons under /fonts/ and
    # /vendor/ (woff2, and Font Awesome's css) get it too and carry no hash: there a changed
    # file gets a new name, never new bytes under the old one. The security headers are repeated here because a
    # static file never reaches PHP (which sets them on everything it answers); add_header
    # is inherited only when a location declares none, so each block lists them all, and
    # the front controller location below deliberately lists none.
    location ~* \.(css|js|woff2|png|jpg|jpeg|svg|webp|ico)$ {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    }

    # The service worker is fetched by its bare name and must always be revalidated.
    location = /sw.js {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/www/index.php;
        fastcgi_param HTTPS $app_https if_not_empty;
        # outbound calls time out well before this (kissj: 10 s); PHP's 30 s max_execution_time counts CPU time only
        fastcgi_read_timeout 45s;
    }

    location ~ \.php$ { return 404; }
}
